name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up current Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Run test gate
        run: npm test
